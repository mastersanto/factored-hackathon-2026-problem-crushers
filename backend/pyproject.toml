[project]
name = "explain-this-charge"
version = "0.1.0"
description = "Transaction-dispute intake assistant for LATAM Bank (Factored AI & Data Hackathon 2026, team Problem Crushers)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9,<2",
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.5,<2",
    "pydantic>=2.13,<3",
    "scikit-learn>=1.7,<2",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mlflow>=3.16,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
